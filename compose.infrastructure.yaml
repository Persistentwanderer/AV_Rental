services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signals
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an untracked
        local environment}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U signals -d signals && psql -U signals -d signals -tAc 'CREATE
        EXTENSION IF NOT EXISTS btree_gist; CREATE EXTENSION IF NOT EXISTS pg_trgm;
        SELECT 1' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
    - 127.0.0.1:55432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - redis-data:/data
    restart: unless-stopped
volumes:
  postgres-data: null
  redis-data: null
