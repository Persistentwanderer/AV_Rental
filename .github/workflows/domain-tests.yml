name: domain-tests

on:
  push:
  pull_request:

jobs:
  hire-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Two-truck hire rules
        working-directory: apps/av_rental
        run: python -m unittest discover -s tests -v
